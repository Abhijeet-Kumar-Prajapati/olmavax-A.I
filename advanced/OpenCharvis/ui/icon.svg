    <circle cx="256" cy="256" r="196" stroke-width="1.5" opacity="0.28"
            stroke-dasharray="8 30"/>
  </g>

  <g stroke="#34e0ff" stroke-width="3" opacity="0.7" stroke-linecap="round">
    <path d="M256 60 v40"/>
    <path d="M256 412 v40"/>
