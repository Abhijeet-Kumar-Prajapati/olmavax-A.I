<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Olmavax A.I — multi-agent AI workspace with voice, memory, plugins, code tools and full offline support.">
<meta name="color-scheme" content="dark light">
<title>Olmavax A.I</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo-mark.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════ SPLASH ══════════ -->
<div id="splash">
  <div class="splash-ring r1"></div>
  <div class="splash-ring r2"></div>
  <div class="splash-ring r3"></div>
  <div class="splash-core"><img src="logo.svg" alt="Olmavax A.I" class="splash-logo"></div>
  <div class="splash-title">Olmavax A.I</div>
  <div class="splash-sub" id="splashSub">Initializing neural core</div>
  <div class="splash-bar"><div class="splash-fill"></div></div>
</div>

<div id="scrim" hidden></div>

<!-- ══════════ SIDEBAR ══════════ -->
<aside id="side" aria-label="Navigation and chat history">
  <div class="side-head">
    <div class="brand">
      <img src="logo-mark.svg" width="28" height="28" alt="" class="logo-mark">
      <span>Olmavax A.I</span>
    </div>
    <div class="head-btns">
      <button id="sideCollapse" class="ib" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/><rect x="4" y="3.5" width="16" height="17" rx="2.5"/></svg>
      </button>
      <button id="sideClose" class="ib" title="Close sidebar" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
      </button>
    </div>
  </div>

  <button id="newChat" class="nb primary-nav" data-tip="newChat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/><path d="M20 20l-4-2V6l4-2z"/><path d="M17 21H6a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <span data-i="newChat">New chat</span>
  </button>

  <div class="side-search" id="sideSearchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
    <input id="csearch" data-ph="searchChats" autocomplete="off" spellcheck="false">
    <button id="csearchX" class="ib tiny" aria-label="Clear search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <button id="talkBtn" class="nb talk-btn" data-tip="talk">
    <span class="talk-orb-mini"></span>
    <span data-i="talk">Talk to Olmavax</span>
    <kbd>Ctrl M</kbd>
  </button>

  <nav class="side-nav">
    <button data-nav="images" data-tip="images" class="nv"><span class="nav-ic ic-img"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg></span><span data-i="images">Images</span><em id="imgPill" class="pill">0</em></button>
    <button data-nav="scheduled" data-tip="scheduled" class="nv"><span class="nav-ic ic-sched"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span data-i="scheduled">Scheduled</span><em id="schPill" class="pill">0</em></button>
    <button data-nav="library" data-tip="library" class="nv"><span class="nav-ic ic-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 000 20.5z"/><path d="M4 5.5v15"/></svg></span><span data-i="library">Library</span><em id="libPill" class="pill">0</em></button>
    <button data-nav="plugins" data-tip="plugins" class="nv"><span class="nav-ic ic-plug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4"/><path d="M6 7h12v4a6 6 0 01-6 6 6 6 0 01-6-6z"/><path d="M12 17v4"/></svg></span><span data-i="plugins">Plugins</span><em id="plugPill" class="pill">0</em></button>
    <button data-nav="codex" data-tip="codex" class="nv"><span class="nav-ic ic-code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8L5 12l3.5 4M15.5 8l3.5 4-3.5 4"/></svg></span><span data-i="codex">Codex</span></button>
    <button data-nav="explore" data-tip="explore" class="nv"><span class="nav-ic ic-explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></span><span data-i="explore">Explore</span></button>
    <button data-nav="projects" data-tip="projects" class="nv"><span class="nav-ic ic-proj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V17a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></span><span data-i="projects">Projects</span></button>
    <button data-nav="memory" data-tip="memory" class="nv"><span class="nav-ic ic-mem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M19.8 7.5l-2.6 1.5M6.8 15l-2.6 1.5"/></svg></span><span data-i="memory">Memory</span><em id="memPill" class="pill">0</em></button>
    <button data-nav="build" data-tip="build" class="nv"><span class="nav-ic ic-build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5l4 4L8 20H4v-4z"/><path d="M12 8l4 4"/></svg></span><span data-i="build">Build</span></button>
    <button data-nav="agents" data-tip="agents" class="nv"><span class="nav-ic ic-agent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke-linecap="round"/></svg></span><span data-i="agents">Agents</span><em id="agentPill" class="pill">Auto</em></button>
  </nav>

  <div class="hist-head">
    <span data-i="history">History</span>
    <button id="histClear" class="ib tiny" title="Clear all chats" aria-label="Clear all chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13"/><path d="M10.5 11v6M13.5 11v6"/></svg>
    </button>
  </div>

  <div class="side-scroll" id="sideScroll">
    <div id="chats"></div>
    <div id="chatsEmpty" class="side-empty" hidden><span data-i="noChats">No chats yet</span></div>
  </div>

  <div class="side-foot">
    <div class="eng" id="engine" title="Which AI is live">
      <span class="dot"></span><span id="engTxt">Checking…</span>
      <button id="engFix" hidden data-i="setup">Setup</button>
    </div>
    <button id="bSet" class="nv profile" data-tip="settings"><span class="nav-ic ic-set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2V21a2 2 0 11-4 0v-.1A1.7 1.7 0 004 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 001 15H1a2 2 0 110-4h.1A1.7 1.7 0 002.6 8.6l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 009 5.6V5a2 2 0 114 0v.1a1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 15h.1a2 2 0 110 4H21z" stroke-linejoin="round"/></svg></span><span data-i="settings">Settings</span></button>
    <div class="side-mini">
      <button id="bTheme" class="ib" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
      <button id="bLang" class="ib" title="Language" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15 0 18M12 3c-2.5 2.7-2.5 15 0 18"/></svg><em id="langPill" class="pill">EN</em></button>
    </div>
  </div>
</aside>

<!-- ══════════ MAIN ══════════ -->
<main>
  <header id="top">
    <button id="menu" class="ib" aria-label="Toggle sidebar" title="Toggle sidebar (Ctrl B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="top-title">
      <span id="chatTitle">Olmavax A.I</span>
      <button id="titleEdit" class="ib tiny" title="Rename chat" aria-label="Rename chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 00-3-3L5 17z"/></svg>
      </button>
    </div>
    <div class="top-right">
      <div class="seg" role="tablist" aria-label="Workspace mode">
        <button class="on" data-mode="chat" role="tab" aria-selected="true" data-i="chatMode">Chat</button>
        <button data-mode="work" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.2"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7"/><path d="M3 12.5h18"/></svg><span data-i="workMode">Work</span></button>
      </div>
      <span id="net" class="net-dot" title="Connection"></span>
      <button id="modelBtn" class="model-btn" aria-haspopup="dialog">
        <span id="modelBtnIcon" class="mi"></span>
        <span id="modelBtnLabel">Auto</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="chev"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button id="voiceBtn" class="icon-btn voice-btn" title="Voice mode (Ctrl M)" aria-label="Voice mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8a3.1 3.1 0 00-3.1 3.1v6a3.1 3.1 0 006.2 0v-6A3.1 3.1 0 0012 2.8z"/><path d="M5.5 11.4a6.5 6.5 0 0013 0"/><path d="M12 17.9V21.2"/><path d="M8.8 21.2h6.4"/></svg>
        <span class="vb-pulse"></span>
      </button>
      <button id="pdfBtn" class="icon-btn" title="Save chat as PDF" aria-label="Save chat as PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10M8.5 10.5L12 14l3.5-3.5"/><path d="M5 19h14"/></svg>
      </button>
    </div>
  </header>

  <div id="stage">
    <section id="home">
      <img src="logo.svg" alt="" class="home-logo" id="homeLogo">
      <h1 id="greet"></h1>
      <div id="homeComposer"></div>
      <div id="sugg">
        <button data-mode="image"><span class="si si-img"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg></span><b data-i="imgSticker">Create an image</b></button>
        <button data-mode="write"><span class="si si-write"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11a2.1 2.1 0 00-3-3L5 16z"/><path d="M13.5 6.5l4 4"/></svg></span><b data-i="writeEdit">Write or edit</b></button>
        <button data-mode="search"><span class="si si-web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3c2.5 2.7 2.5 15 0 18M12 3c-2.5 2.7-2.5 15 0 18"/></svg></span><b data-i="searchTheWeb">Search the web</b></button>
        <button data-mode="research"><span class="si si-res"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3v7L5 19a2 2 0 002 2h10a2 2 0 002-2l-5-9V3"/><path d="M8 3h8"/></svg></span><b data-i="deepResearch">Deep research</b></button>
      </div>
    </section>
    <section id="msgs"></section>
  </div>

  <div id="dock"></div>
</main>

<!-- ══════════ COMPOSER ══════════ -->
<div id="comp">
  <!-- voice dock: small, centred, directly above the composer -->
  <div id="voiceDock" hidden>
    <div class="v-dock" role="dialog" aria-label="Voice mode">
      <button id="vstop" class="v-btn v-stop" title="Stop speaking" aria-label="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>
        <span data-i="stop">Stop</span>
      </button>

      <div class="v-center">
        <div class="v-orb" id="orb" title="Click to stop listening"></div>
        <div class="v-meta">
          <div class="v-status" id="vstat">Listening…</div>
          <div class="v-transcript" id="vtext"></div>
        </div>
        <canvas id="orbWave" class="v-wave" width="180" height="26"></canvas>
      </div>

      <button id="vclose" class="v-btn v-exit" title="Exit voice (Esc)" aria-label="Exit voice">
        <span data-i="exit">Exit</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <!-- separate voice log: spoken turns only, kept apart from typed chat -->
  <div id="voiceLog" hidden>
    <div class="vl-head">
      <span class="vl-dot"></span><b data-i="voiceLog">Voice log</b>
      <button id="vlClear" data-i="clear">Clear</button>
      <button id="vlToggle" title="Collapse" aria-label="Collapse voice log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="vl-body" id="vlBody"></div>
  </div>
  <div class="cbox">
    <div id="atts"></div>
    <div class="crow">
      <button id="plus" class="ib plus" aria-label="Add" aria-haspopup="menu" title="Add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <span id="chip" class="chipx" hidden></span>
      <textarea id="input" rows="1" data-ph="placeholder" spellcheck="true"></textarea>
      <button id="think" class="pillbtn" aria-pressed="false" title="Deep thinking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 3a3 3 0 00-2.4 4.8A3 3 0 006 12a3 3 0 003.6 4.2A3 3 0 0012 21a3 3 0 002.4-4.8A3 3 0 0018 12a3 3 0 00-2.6-4.2A3 3 0 0015 3a3 3 0 00-3 0 3 3 0 00-3 0z"/></svg>
        <b data-i="think">Think</b>
      </button>
      <button id="mic" class="ib" aria-label="Dictate" title="Dictate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg>
      </button>
      <button id="vstart" class="vstart" aria-label="Start voice" title="Start voice (Ctrl M)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14.5a2.9 2.9 0 002.9-2.9V5.4a2.9 2.9 0 10-5.8 0v6.2A2.9 2.9 0 0012 14.5zm6.6-2.9a6.6 6.6 0 01-13.2 0H3.8a8.2 8.2 0 007.4 8.1v2.2H8.6v1.6h6.8v-1.6h-2.6v-2.2a8.2 8.2 0 007.4-8.1z"/></svg>
      </button>
      <button id="go" class="go" aria-label="Send" hidden></button>
    </div>
  </div>
  <div class="chint" data-i="disclaimer">Olmavax can make mistakes. Check important info.</div>

  <div id="menu2" hidden role="menu">
    <button data-act="files"><span class="ai a-file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v3a3 3 0 01-3 3H6a3 3 0 01-3-3v-3"/><path d="M7 9l5-5 5 5M12 4v12"/></svg></span><span class="atx"><b data-i="addFiles">Upload from computer</b><small data-i="addFilesHint">Photos, docs, code, PDF</small></span></button>
    <button data-act="sketch"><span class="ai a-sketch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 21l4-1 12-12a2.1 2.1 0 00-3-3L4 17z"/></svg></span><span class="atx"><b data-i="sketch">Draw &amp; sketch</b><small data-i="sketchHint">Doodle then attach</small></span></button>
    <button data-act="image"><span class="ai a-img"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg></span><span class="atx"><b data-i="createImage">Create an image</b><small data-i="createImageHint">Visualize anything</small></span></button>
    <button data-act="search"><span class="ai a-web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3c2.5 2.7 2.5 15 0 18M12 3c-2.5 2.7-2.5 15 0 18"/></svg></span><span class="atx"><b data-i="webSearch">Web search</b><small data-i="webSearchHint">Real-time results</small></span></button>
    <button data-act="research"><span class="ai a-res"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 3v7L5 19a2 2 0 002 2h10a2 2 0 002-2l-5-9V3"/><path d="M8 3h8"/></svg></span><span class="atx"><b data-i="deepResearch">Deep research</b><small data-i="deepResearchHint">Multi-step analysis</small></span></button>
    <hr>
    <button data-act="codex"><span class="ai a-code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8L5 12l3.5 4M15.5 8l3.5 4-3.5 4"/></svg></span><span class="atx"><b data-i="codex">Codex</b><small data-i="codexHint">Snippet workbench</small></span></button>
    <button data-act="library"><span class="ai a-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M8 7h8M8 11h8"/></svg></span><span class="atx"><b data-i="saveToLibrary">Save to Library</b><small data-i="saveToLibraryHint">Keep this reply</small></span></button>
    <button data-act="schedule"><span class="ai a-sched"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span class="atx"><b data-i="scheduleThis">Schedule this</b><small data-i="scheduleThisHint">Run it later</small></span></button>
    <button data-act="project"><span class="ai a-proj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V17a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></span><span class="atx"><b data-i="project">Project</b><small data-i="projectHint">Persistent instructions</small></span></button>
    <button data-act="build"><span class="ai a-build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5l4 4L8 20H4v-4z"/><path d="M12 8l4 4"/></svg></span><span class="atx"><b data-i="buildSomething">Build something</b><small data-i="buildHint">Site, app, deck, portfolio</small></span></button>
    <button data-act="record"><span class="ai a-rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/></svg></span><span class="atx"><b data-i="recordAudio">Record audio</b><small data-i="recordHint">Attach a voice note</small></span></button>
  </div>
</div>

<input type="file" id="file" multiple hidden accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.c,.cpp,.go,.rs,.sql,.xml,.yml,.yaml,.log,.pdf">

<!-- ══════════ MOBILE BOTTOM NAV ══════════ -->
<nav id="botnav" aria-label="Quick navigation">
  <button data-bn="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i="newChat">New</span></button>
  <button data-bn="talk" class="bn-talk"><span class="bn-orb"></span><span data-i="talk">Talk</span></button>
  <button data-bn="images"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg><span data-i="images">Images</span></button>
  <button data-bn="plugins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4"/><path d="M6 7h12v4a6 6 0 01-6 6 6 6 0 01-6-6z"/><path d="M12 17v4"/></svg><span data-i="plugins">Plugins</span></button>
  <button data-bn="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span data-i="menu">Menu</span></button>
</nav>

<!-- ══════════ MODALS ══════════ -->
<div id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true">
    <button id="mclose" class="m-x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="mbody"></div>
  </div>
</div>

<div id="palette" hidden>
  <div class="pal-card" role="dialog" aria-modal="true">
    <div class="pal-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg><input id="palQ" data-ph="searchCommands" autocomplete="off" spellcheck="false"></div>
    <div class="pal-list" id="palList"></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="highlight.js"></script>
<script src="app.js"></script>
</body>
</html>
