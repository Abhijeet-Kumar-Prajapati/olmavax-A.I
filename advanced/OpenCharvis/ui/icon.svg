  <rect width="512" height="512" rx="112" fill="#03060d"/>

  <circle cx="256" cy="256" r="150" fill="url(#core)" opacity="0.55"/>
  <circle cx="256" cy="256" r="74"  fill="url(#core)"/>

  <g fill="none" stroke="url(#ring)" stroke-linecap="round">
